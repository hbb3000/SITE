<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TextFlow PDF</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at top left, #243b55, transparent 35%),
                radial-gradient(circle at bottom right, #1d2671, transparent 35%),
                #080b12;
            color: white;
        }

        /* HEADER */

        header {
            height: 75px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 45px;

            background: rgba(10, 14, 25, 0.85);
            backdrop-filter: blur(15px);

            border-bottom: 1px solid rgba(255,255,255,0.08);

            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo {
            font-size: 23px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .logo span {
            color: #6ea8ff;
        }

        .header-text {
            color: #9ca6b8;
            font-size: 14px;
        }


        /* MAIN */

        .container {
            width: min(1200px, 94%);
            margin: 45px auto;
        }

        .title {
            text-align: center;
            margin-bottom: 35px;
        }

        .title h1 {
            margin: 0;
            font-size: 43px;
            background: linear-gradient(90deg, #ffffff, #72a7ff);
            -webkit-background-clip: text;
            color: transparent;
        }

        .title p {
            color: #9ca6b8;
            margin-top: 12px;
            font-size: 16px;
        }


        /* EDITOR */

        .editor {
            display: grid;
            grid-template-columns: 1fr 290px;
            gap: 22px;
        }


        .editor-box,
        .side-box {
            background: rgba(15, 20, 32, 0.85);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 18px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            backdrop-filter: blur(15px);
        }


        /* TOOLBAR */

        .toolbar {
            min-height: 65px;
            padding: 12px 15px;

            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;

            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .toolbar button,
        .toolbar select {

            height: 40px;

            background: #151b2a;
            color: white;

            border: 1px solid #293246;

            border-radius: 8px;

            padding: 0 12px;

            cursor: pointer;

            font-size: 14px;
        }

        .toolbar button:hover,
        .toolbar select:hover {
            background: #20293c;
        }

        .toolbar button.active {
            background: #407cff;
            border-color: #407cff;
        }

        .separator {
            width: 1px;
            height: 28px;
            background: #30394c;
            margin: 0 5px;
        }


        /* TEXT AREA */

        textarea {

            display: block;

            width: 100%;
            height: 600px;

            resize: vertical;

            border: none;
            outline: none;

            background: transparent;

            color: white;

            padding: 35px;

            font-size: 18px;

            line-height: 1.7;

            font-family: Arial, sans-serif;

        }

        textarea::placeholder {
            color: #667085;
        }


        /* FOOTER EDITOR */

        .editor-footer {

            display: flex;

            justify-content: space-between;

            align-items: center;

            padding: 12px 20px;

            color: #778197;

            font-size: 13px;

            border-top: 1px solid rgba(255,255,255,0.08);

        }


        /* SIDE PANEL */

        .side-box {

            padding: 22px;

            height: fit-content;

        }

        .side-title {

            font-size: 17px;

            font-weight: bold;

            margin-bottom: 20px;

        }


        .field {

            margin-bottom: 20px;

        }

        .field label {

            display: block;

            color: #929bad;

            font-size: 13px;

            margin-bottom: 8px;

        }

        .field input,
        .field select {

            width: 100%;

            height: 44px;

            background: #111724;

            border: 1px solid #293246;

            border-radius: 8px;

            color: white;

            padding: 0 12px;

            outline: none;

        }

        .field input:focus,
        .field select:focus {

            border-color: #4d82ff;

        }


        /* DOWNLOAD */

        .download {

            width: 100%;

            height: 50px;

            border: none;

            border-radius: 10px;

            background: linear-gradient(
                135deg,
                #407cff,
                #635bff
            );

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;

        }

        .download:hover {

            transform: translateY(-2px);

            box-shadow:
                0 8px 25px rgba(64,124,255,0.3);

        }


        .clear {

            width: 100%;

            height: 45px;

            margin-top: 10px;

            border: 1px solid #30394c;

            border-radius: 10px;

            background: transparent;

            color: #b9c0cf;

            cursor: pointer;

        }

        .clear:hover {

            background: #191f2d;

        }


        /* INFO */

        .info {

            margin-top: 20px;

            padding: 15px;

            background: #111724;

            border-radius: 10px;

            color: #7f899d;

            font-size: 12px;

            line-height: 1.7;

        }


        /* MOBILE */

        @media (max-width: 850px) {

            header {

                padding: 0 20px;

            }

            .header-text {

                display: none;

            }

            .editor {

                grid-template-columns: 1fr;

            }

            .side-box {

                order: -1;

            }

            textarea {

                height: 450px;

            }

            .title h1 {

                font-size: 34px;

            }

        }


        @media (max-width: 500px) {

            .container {

                width: 96%;

                margin: 25px auto;

            }

            .toolbar {

                padding: 10px;

            }

            textarea {

                padding: 20px;

                height: 400px;

            }

        }

    </style>
</head>


<body>


<header>

    <div class="logo">
        Text<span>Flow</span>
    </div>

    <div class="header-text">
        Simple • Fast • Private
    </div>

</header>



<div class="container">


    <div class="title">

        <h1>Text to PDF</h1>

        <p>
            Write your document and download it as a PDF
        </p>

    </div>



    <div class="editor">


        <!-- EDITOR -->

        <div class="editor-box">


            <div class="toolbar">


                <button
                    onclick="toggleBold()"
                    id="boldButton">
                    <b>B</b>
                </button>


                <button
                    onclick="toggleItalic()"
                    id="italicButton">
                    <i>I</i>
                </button>


                <div class="separator"></div>


                <select
                    id="fontSelect"
                    onchange="changeFont()">

                    <option value="Arial">
                        Arial
                    </option>

                    <option value="Times New Roman">
                        Times New Roman
                    </option>

                    <option value="Courier New">
                        Courier New
                    </option>

                    <option value="Georgia">
                        Georgia
                    </option>

                    <option value="Verdana">
                        Verdana
                    </option>

                </select>


                <select
                    id="fontSize"
                    onchange="changeFontSize()">

                    <option value="12">
                        12
                    </option>

                    <option value="14">
                        14
                    </option>

                    <option value="16">
                        16
                    </option>

                    <option value="18" selected>
                        18
                    </option>

                    <option value="20">
                        20
                    </option>

                    <option value="24">
                        24
                    </option>

                    <option value="28">
                        28
                    </option>

                    <option value="32">
                        32
                    </option>

                    <option value="40">
                        40
                    </option>

                </select>


            </div>



            <textarea
                id="text"
                placeholder="Start writing here..."></textarea>



            <div class="editor-footer">

                <span id="wordCount">
                    0 words
                </span>

                <span id="charCount">
                    0 characters
                </span>

            </div>


        </div>



        <!-- SETTINGS -->

        <div class="side-box">


            <div class="side-title">
                PDF Settings
            </div>



            <div class="field">

                <label>
                    File name
                </label>

                <input
                    type="text"
                    id="fileName"
                    value="my-document">

            </div>



            <div class="field">

                <label>
                    Page size
                </label>

                <select id="pageSize">

                    <option value="A4">
                        A4
                    </option>

                    <option value="LETTER">
                        Letter
                    </option>

                </select>

            </div>



            <div class="field">

                <label>
                    Text color
                </label>

                <input
                    type="color"
                    id="textColor"
                    value="#000000">

            </div>



            <button
                class="download"
                onclick="downloadPDF()">

                Download PDF

            </button>



            <button
                class="clear"
                onclick="clearText()">

                Clear document

            </button>



            <div class="info">

                Your document is processed
                directly in your browser.

                <br><br>

                No account is required.

            </div>


        </div>


    </div>


</div>



<script>


let bold = false;

let italic = false;



const textArea =
    document.getElementById("text");



/* WORD COUNTER */

textArea.addEventListener(
    "input",
    updateCounter
);


function updateCounter() {

    let text =
        textArea.value.trim();


    let words =
        text === ""
        ? 0
        : text.split(/\s+/).length;


    let characters =
        textArea.value.length;


    document.getElementById(
        "wordCount"
    ).textContent =
        words + " words";


    document.getElementById(
        "charCount"
    ).textContent =
        characters + " characters";

}



/* FONT SIZE */

function changeFontSize() {

    let size =
        document.getElementById(
            "fontSize"
        ).value;


    textArea.style.fontSize =
        size + "px";

}



/* FONT */

function changeFont() {

    let font =
        document.getElementById(
            "fontSelect"
        ).value;


    textArea.style.fontFamily =
        font;

}



/* BOLD */

function toggleBold() {

    bold = !bold;


    if (bold) {

        textArea.style.fontWeight =
            "bold";

        document.getElementById(
            "boldButton"
        ).classList.add("active");

    }

    else {

        textArea.style.fontWeight =
            "normal";

        document.getElementById(
            "boldButton"
        ).classList.remove("active");

    }

}



/* ITALIC */

function toggleItalic() {

    italic = !italic;


    if (italic) {

        textArea.style.fontStyle =
            "italic";

        document.getElementById(
            "italicButton"
        ).classList.add("active");

    }

    else {

        textArea.style.fontStyle =
            "normal";

        document.getElementById(
            "italicButton"
        ).classList.remove("active");

    }

}



/* CLEAR */

function clearText() {

    if (
        confirm(
            "Are you sure you want to clear the document?"
        )
    ) {

        textArea.value = "";

        updateCounter();

    }

}



/* DOWNLOAD PDF */

function downloadPDF() {

    let text =
        textArea.value;


    if (text.trim() === "") {

        alert(
            "Please write something first."
        );

        return;

    }


    let fileName =
        document.getElementById(
            "fileName"
        ).value.trim();


    if (fileName === "") {

        fileName =
            "my-document";

    }


    if (
        !fileName.toLowerCase().endsWith(".pdf")
    ) {

        fileName += ".pdf";

    }



    let fontSize =
        Number(
            document.getElementById(
                "fontSize"
            ).value
        );


    let pageSize =
        document.getElementById(
            "pageSize"
        ).value;


    let textColor =
        document.getElementById(
            "textColor"
        ).value;



    /* PAGE SIZE */

    let pageWidth;

    let pageHeight;


    if (pageSize === "A4") {

        pageWidth = 595;

        pageHeight = 842;

    }

    else {

        pageWidth = 612;

        pageHeight = 792;

    }



    let margin = 50;


    let lineHeight =
        fontSize * 1.5;



    /*
        Convert HEX color
        to PDF RGB
    */

    let r =
        parseInt(
            textColor.substring(1,3),
            16
        ) / 255;


    let g =
        parseInt(
            textColor.substring(3,5),
            16
        ) / 255;


    let b =
        parseInt(
            textColor.substring(5,7),
            16
        ) / 255;



    /*
        Split text
    */

    let paragraphs =
        text.split("\n");


    let lines = [];



    let charactersPerLine =
        Math.max(
            20,
            Math.floor(
                (pageWidth - margin * 2)
                /
                (fontSize * 0.5)
            )
        );



    for (
        let p = 0;
        p < paragraphs.length;
        p++
    ) {


        let paragraph =
            paragraphs[p];


        if (paragraph === "") {

            lines.push("");

            continue;

        }



        let words =
            paragraph.split(/\s+/);


        let currentLine = "";



        for (
            let i = 0;
            i < words.length;
            i++
        ) {


            let testLine =
                currentLine === ""
                ? words[i]
                : currentLine +
                  " " +
                  words[i];



            if (
                testLine.length >
                charactersPerLine
            ) {


                if (
                    currentLine !== ""
                ) {

                    lines.push(
                        currentLine
                    );

                }


                currentLine =
                    words[i];

            }

            else {

                currentLine =
                    testLine;

            }

        }



        if (
            currentLine !== ""
        ) {

            lines.push(
                currentLine
            );

        }

    }



    let linesPerPage =
        Math.max(
            1,
            Math.floor(
                (
                    pageHeight -
                    margin * 2
                )
                /
                lineHeight
            )
        );



    let pages = [];



    for (
        let i = 0;
        i < lines.length;
        i += linesPerPage
    ) {

        pages.push(
            lines.slice(
                i,
                i + linesPerPage
            )
        );

    }



    /*
        PDF creation
    */

    let objects = [];

    let pdf =
        "%PDF-1.4\n";


    function addObject(content) {

        let number =
            objects.length + 1;


        objects.push(
            number +
            " 0 obj\n" +
            content +
            "\nendobj\n"
        );


        return number;

    }



    /*
        Font
    */

    let fontObject =
        addObject(
            "<< /Type /Font " +
            "/Subtype /Type1 " +
            "/BaseFont /Helvetica >>"
        );



    let pageObjects = [];



    for (
        let p = 0;
        p < pages.length;
        p++
    ) {


        let content =
            "BT\n";


        content +=
            "/F1 " +
            fontSize +
            " Tf\n";


        content +=
            r.toFixed(3) +
            " " +
            g.toFixed(3) +
            " " +
            b.toFixed(3) +
            " rg\n";


        let y =
            pageHeight - margin;



        for (
            let i = 0;
            i < pages[p].length;
            i++
        ) {


            let line =
                pages[p][i];


            /*
                PDF escape
            */

            line =
                line
                .replace(
                    /\\/g,
                    "\\\\"
                )
                .replace(
                    /\(/g,
                    "\\("
                )
                .replace(
                    /\)/g,
                    "\\)"
                );



            content +=
                "1 0 0 1 " +
                margin +
                " " +
                y +
                " Tm\n";


            content +=
                "(" +
                line +
                ") Tj\n";


            y -=
                lineHeight;

        }



        content +=
            "ET\n";



        let contentObject =
            addObject(
                "<< /Length " +
                content.length +
                " >>\n" +
                "stream\n" +
                content +
                "endstream"
            );



        let pageObject =
            addObject(
                "<< /Type /Page " +
                "/MediaBox [0 0 " +
                pageWidth +
                " " +
                pageHeight +
                "] " +
                "/Resources << " +
                "/Font << /F1 " +
                fontObject +
                " 0 R >> >> " +
                "/Contents " +
                contentObject +
                " 0 R >>"
            );


        pageObjects.push(
            pageObject
        );

    }



    /*
        Pages object
    */

    let kids = "";


    for (
        let i = 0;
        i < pageObjects.length;
        i++
    ) {

        kids +=
            pageObjects[i] +
            " 0 R ";

    }



    let pagesObject =
        addObject(
            "<< /Type /Pages " +
            "/Kids [" +
            kids +
            "] " +
            "/Count " +
            pageObjects.length +
            " >>"
        );



    /*
        Parent
    */

    for (
        let i = 0;
        i < pageObjects.length;
        i++
    ) {


        let index =
            pageObjects[i] - 1;


        objects[index] =
            objects[index].replace(
                "/Resources",
                "/Parent " +
                pagesObject +
                " 0 R\n" +
                "/Resources"
            );

    }



    /*
        Catalog
    */

    let catalogObject =
        addObject(
            "<< /Type /Catalog " +
            "/Pages " +
            pagesObject +
            " 0 R >>"
        );



    /*
        XREF
    */

    let offsets = [];

    let position =
        pdf.length;


    for (
        let i = 0;
        i < objects.length;
        i++
    ) {

        offsets.push(
            position
        );


        pdf +=
            objects[i];


        position =
            pdf.length;

    }



    let xref =
        pdf.length;


    pdf +=
        "xref\n" +
        "0 " +
        (objects.length + 1) +
        "\n" +
        "0000000000 65535 f \n";



    for (
        let i = 0;
        i < offsets.length;
        i++
    ) {

        pdf +=
            String(
                offsets[i]
            ).padStart(
                10,
                "0"
            ) +
            " 00000 n \n";

    }



    pdf +=
        "trailer\n" +
        "<< /Size " +
        (objects.length + 1) +
        " /Root " +
        catalogObject +
        " 0 R >>\n" +
        "startxref\n" +
        xref +
        "\n" +
        "%%EOF";



    /*
        DOWNLOAD
    */

    let blob =
        new Blob(
            [pdf],
            {
                type:
                    "application/pdf"
            }
        );


    let url =
        URL.createObjectURL(blob);


    let link =
        document.createElement("a");


    link.href =
        url;


    link.download =
        fileName;


    document.body.appendChild(
        link
    );


    link.click();


    document.body.removeChild(
        link
    );


    setTimeout(
        function() {

            URL.revokeObjectURL(
                url
            );

        },
        1000
    );

}


</script>

</body>
</html>
